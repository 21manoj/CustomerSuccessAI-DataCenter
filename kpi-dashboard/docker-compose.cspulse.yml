# ================================================================
# CS Pulse Platform — Docker Compose (Development / Local)
#
# Usage (from kpi-dashboard/ directory):
#   docker compose -f docker-compose.cspulse.yml up -d --build
#   docker compose -f docker-compose.cspulse.yml down
#   docker compose -f docker-compose.cspulse.yml logs -f
#
# Prerequisites:
#   - .env file with OPENAI_API_KEY, ANTHROPIC_API_KEY
#   - Build context is parent dir (..) so load-driver is included
# ================================================================

services:
  # ──────────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────────
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: cspulse-postgres
    environment:
      POSTGRES_DB: cs_pulse
      POSTGRES_USER: cspulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cspulse_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cspulse-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cspulse -d cs_pulse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────
  # CS Pulse Platform (Flask + React + Nginx)
  # Build context is project root (..) to include load-driver
  # ──────────────────────────────────────────────
  cs-pulse:
    build:
      context: ..
      dockerfile: kpi-dashboard/Dockerfile.cspulse
    container_name: cspulse-platform
    ports:
      - "80:80"       # Nginx (React + API proxy)
      - "5059:5059"   # Direct Flask API access (optional/debugging)
    environment:
      # Database (points to postgres container)
      DATABASE_URL: postgresql://cspulse:${POSTGRES_PASSWORD:-cspulse_dev}@postgres:5432/cs_pulse

      # AI API Keys (from .env file)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Flask settings
      FLASK_APP: app_v3_minimal.py
      FLASK_ENV: production
      # Must be at least 32 chars (set SECRET_KEY in .env for production)
      SECRET_KEY: ${SECRET_KEY:-cspulse-dev-secret-key-min-32-chars}

      # Gunicorn tuning
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

      # Load driver (bundled in image at /app/load-driver)
      LOAD_DRIVER_DIR: /app/load-driver
    volumes:
      # Persistent uploads
      - uploads:/app/backend/uploads
      # Customer vertical data (journey files, generated CSVs) — only data subdir, not Python code
      - verticals_data:/app/backend/verticals/_template/journey/data
      # SQLite instance dir (legacy, may still be used by some scripts)
      - instance:/app/backend/instance
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cspulse-net
    restart: unless-stopped

networks:
  cspulse-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
  verticals_data:
    driver: local
  instance:
    driver: local
