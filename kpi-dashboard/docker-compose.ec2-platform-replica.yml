# ================================================================
# EC2 only — second platform container (same Postgres & DB, extra capacity).
# Merge WITH docker-compose.ec2-registry.yml (+ docker-compose.ec2-loaddriver.yml)
# on the EC2 host (~/cspulse). Set REGISTRY + PLATFORM_TAG in .env; see
# scripts/rehydrate-ec2-ecr.sh.
#
# Host ports (primary cs-pulse: 80/443/8001):
#   9080  HTTP   9443  HTTPS   8002  MCP
#
# External: BASE_URL=http://<EC2_PUBLIC_IP>:9080
# Same host / cspulse-net: http://cspulse-platform-b:5059
# Security group: inbound TCP 9080 (9443/8002 if used).
# ================================================================

services:
  cs-pulse-b:
    image: ${REGISTRY}/cspulse-platform:${PLATFORM_TAG:-latest}
    container_name: cspulse-platform-b
    ports:
      - "9080:80"
      - "9443:443"
      - "8002:8001"
    environment:
      DATABASE_URL: postgresql://cspulse:${POSTGRES_PASSWORD}@postgres:5432/cs_pulse
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FLASK_APP: app_v3_minimal.py
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      FEATURE_MCP_SERVER: ${FEATURE_MCP_SERVER:-true}
      FEATURE_CONTEXT_GRAPH: ${FEATURE_CONTEXT_GRAPH:-true}
      FEATURE_ASK_AI_V2: ${FEATURE_ASK_AI_V2:-true}
      LOAD_DRIVER_DIR: /app/load-driver
    volumes:
      - uploads:/app/backend/uploads
      - verticals:/app/backend/verticals/_customers
      - instance:/app/backend/instance
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cspulse-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5059/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
