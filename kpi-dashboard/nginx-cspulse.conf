# CS Pulse — Nginx Configuration
# Serves React frontend on / and proxies /api/* to Flask backend

server {
    listen 80;
    server_name _;

    # Serve React frontend (static files)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Flask/Gunicorn backend
    location /api/ {
        proxy_pass http://127.0.0.1:5059;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running API calls (onboarding, score calculation)
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Increase buffer for large JSON responses
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # MCP Server (Model Context Protocol) — HTTP/SSE transport for Claude.ai
    # FastMCP serves on /mcp by default (streamable-http transport)
    location /mcp {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass auth header through for API key validation
        proxy_set_header Authorization $http_authorization;

        # SSE: disable buffering so events stream immediately
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeouts for streaming MCP sessions
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # Disable access to dotfiles
    location ~ /\. {
        deny all;
    }
}
