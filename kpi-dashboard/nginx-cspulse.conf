# CS Pulse — Nginx Configuration
# Serves React frontend on / and proxies /api/* to Flask backend
#
# Timed access log (included inside http {}): total request time + upstream breakdown
# for /api/* (Gunicorn) and /mcp (MCP). Static-only hits have "-" for upstream_* vars.
# See: https://nginx.org/en/docs/http/ngx_http_log_module.html#var_upstream_response_time

log_format cspulse_timed '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time '
    'uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log cspulse_timed;

    # Allow large CSV uploads (KPI measurements can be 2-5MB for 30+ accounts)
    client_max_body_size 10m;

    # MSU Vision 2020 MVP (Django) — sibling container on Docker network (see docker-compose.ec2-*.yml)
    # Use Docker embedded DNS + variable proxy_pass so nginx starts even when msu-vision is not running
    # (static upstream "msu-vision" causes [emerg] host not found and aborts nginx — taking down CS Pulse).
    location = /msu2020 {
        return 301 /msu2020/;
    }
    location ^~ /msu2020/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        rewrite ^/msu2020/(.*)$ /$1 break;
        set $msu_upstream msu-vision;
        proxy_pass http://$msu_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        client_max_body_size 26m;
    }

    # Serve React frontend (static files)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Flask/Gunicorn backend
    location /api/ {
        proxy_pass http://127.0.0.1:5059;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running API calls (onboarding, score calculation)
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Increase buffer for large JSON responses
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # Partner MCP Server — must be before the trial /mcp/<key> regex so /mcp/partner is not captured
    # ^~ skips regex matching for this prefix (nginx: proxy_pass URI + regex location is invalid)
    location ^~ /mcp/partner {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass auth header through for partner API key validation
        proxy_set_header Authorization $http_authorization;

        # SSE: disable buffering so events stream immediately
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeouts for streaming MCP sessions
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # MCP Server — Path-based API key auth for trial customers
    # URL format: /mcp/<api_key> — nginx extracts key and forwards as Bearer token
    # Regex locations cannot use proxy_pass with a URI; rewrite to /mcp then proxy without path
    location ~ ^/mcp/([a-zA-Z0-9_-]+)$ {
        set $api_key $1;
        rewrite ^ /mcp break;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Inject API key as Bearer token — MCP server validates against DB
        proxy_set_header Authorization "Bearer $api_key";

        # SSE: disable buffering so events stream immediately
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeouts for streaming MCP sessions
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # MCP Server (Model Context Protocol) — HTTP/SSE transport for Claude.ai
    # FastMCP serves on /mcp by default (streamable-http transport)
    # Direct access without key (for internal use / server-level MCP_SERVER_API_KEY)
    location /mcp {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass auth header through for API key validation
        proxy_set_header Authorization $http_authorization;

        # SSE: disable buffering so events stream immediately
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeouts for streaming MCP sessions
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # Disable access to dotfiles
    location ~ /\. {
        deny all;
    }
}
