# ================================================================
# Load Driver — Standalone (EC2-B)
# Run on a separate host from the platform. Targets EC2-A via HTTPS.
#
# Usage on EC2-B:
#   export CS_PULSE_BASE_URL=https://<ec2-a-host-or-alb>
#   docker compose -f docker-compose.loaddriver-standalone.yml up -d --build
#
# No dependency on cs-pulse or cspulse network.
# ================================================================

version: '3.8'

services:
  load-driver-customer-1:
    build:
      context: ./load-driver
      dockerfile: Dockerfile
    container_name: cspulse-load-driver-cust-1
    environment:
      CS_PULSE_BASE_URL: ${CS_PULSE_BASE_URL:?Set CS_PULSE_BASE_URL to your EC2-A URL (e.g. https://platform.example.com)}
      CS_PULSE_ADMIN_EMAIL: admin+cust1@cspulse.test
      CS_PULSE_ADMIN_PASSWORD: ${CS_PULSE_ADMIN_PASSWORD:-LoadDriver2026!}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: 1
    volumes:
      - ./results/customer-1:/app/results
    command: ["--scenarios", "1,2a,2b,2c,2d,2e,3,4,5,6", "--customers", "1", "--base-url", "${CS_PULSE_BASE_URL}", "--results-dir", "/app/results"]
    restart: "no"

  load-driver-customer-2:
    build:
      context: ./load-driver
      dockerfile: Dockerfile
    container_name: cspulse-load-driver-cust-2
    environment:
      CS_PULSE_BASE_URL: ${CS_PULSE_BASE_URL:?Set CS_PULSE_BASE_URL}
      CS_PULSE_ADMIN_EMAIL: admin+cust2@cspulse.test
      CS_PULSE_ADMIN_PASSWORD: ${CS_PULSE_ADMIN_PASSWORD:-LoadDriver2026!}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: 1
    volumes:
      - ./results/customer-2:/app/results
    command: ["--scenarios", "1,2a,2b,2c,2d,2e,3,4,5,6", "--customers", "2", "--base-url", "${CS_PULSE_BASE_URL}", "--results-dir", "/app/results"]
    restart: "no"

  load-driver-customer-3:
    build:
      context: ./load-driver
      dockerfile: Dockerfile
    container_name: cspulse-load-driver-cust-3
    environment:
      CS_PULSE_BASE_URL: ${CS_PULSE_BASE_URL:?Set CS_PULSE_BASE_URL}
      CS_PULSE_ADMIN_EMAIL: admin+cust3@cspulse.test
      CS_PULSE_ADMIN_PASSWORD: ${CS_PULSE_ADMIN_PASSWORD:-LoadDriver2026!}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: 1
    volumes:
      - ./results/customer-3:/app/results
    command: ["--scenarios", "1,2a,2b,2c,2d,2e,3,4,5,6", "--customers", "3", "--base-url", "${CS_PULSE_BASE_URL}", "--results-dir", "/app/results"]
    restart: "no"
