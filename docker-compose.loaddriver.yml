# ================================================================
# Load Driver — Docker Compose (Ring 3: Test Harness)
#
# Connects to CS Pulse Platform on the kpi-dashboard_cspulse-net network.
# Platform must be running first:
#   cd kpi-dashboard && docker compose -f docker-compose.cspulse.yml up -d
#
# Then run load driver:
#   docker compose -f docker-compose.loaddriver.yml up --build
#
# Single scenario (e.g. Scenario 7 — Data Ingestion):
#   docker compose -f docker-compose.loaddriver.yml run --rm load-driver-customer-1 \
#     python -u run_scenario.py --scenario 7 --customer-id 1 \
#       --base-url http://cspulse-platform:5059 \
#       --email dc2s_super@test.com --password 'DC2_Super_2024!'
# ================================================================

services:
  # ================================================================
  # Load Driver - Customer 1
  # ================================================================
  load-driver-customer-1:
    build:
      context: ./load-driver
      dockerfile: Dockerfile
    container_name: cspulse-load-driver-cust-1
    environment:
      CS_PULSE_BASE_URL: http://cspulse-platform:5059
      CS_PULSE_ADMIN_EMAIL: dc2s_super@test.com
      CS_PULSE_ADMIN_PASSWORD: DC2_Super_2024!
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: 1
    volumes:
      - ./results/customer-1:/app/results
      - ./load-driver:/app
    command: >
      python -u driver.py
      --scenarios 1,2a,2b,2c,2d,2e,3,4,5,6,7
      --customers 1
      --base-url http://cspulse-platform:5059
      --results-dir /app/results
    networks:
      - kpi-dashboard_cspulse-net
    healthcheck:
      test: ["CMD", "test", "-f", "/app/results/LOAD_TEST_RESULTS.md"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 60s

  # ================================================================
  # Load Driver - Customer 2
