  # ================================================================
  # CS Pulse Backend (referenced, not defined here)
  # ================================================================
  # Assumes cs-pulse service is running on network cspulse
  # Start with: docker-compose -f docker-compose.yml up -d
  # Then: docker-compose -f docker-compose.loaddriver.yml up -d

networks:
  cspulse:
    external: true
    # If not external, create with:
    # docker network create cspulse
