version: '3.8'

services:
  # ================================================================
  # Load Driver - Customer 1 (50 accounts)
  # ================================================================
  load-driver-customer-1:
    build:
      context: ./load-driver
      dockerfile: Dockerfile
    container_name: cspulse-load-driver-cust-1
    environment:
      CS_PULSE_BASE_URL: http://cs-pulse:5059
      CS_PULSE_ADMIN_EMAIL: admin+cust1@cspulse.test
      CS_PULSE_ADMIN_PASSWORD: LoadDriver2026!
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: 1
    volumes:
      - ./results/customer-1:/app/results
      - ./load-driver:/app
    command: >
      python -u driver.py
      --scenarios 1,2a,2b,2c,2d,2e,3,4,5,6
      --customers 1
      --base-url http://cs-pulse:5059
      --results-dir /app/results
    networks:
      - cspulse
    depends_on:
      - cs-pulse
    healthcheck:
      test: ["CMD", "test", "-f", "/app/results/LOAD_TEST_RESULTS.md"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 60s

