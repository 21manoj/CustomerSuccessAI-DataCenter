# Minimal ECR deploy: build cspulse-platform and push.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, ECR_REGISTRY
# ECR_REGISTRY example: 822824391150.dkr.ecr.us-east-1.amazonaws.com (no https://)

name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          docker build -f kpi-dashboard/Dockerfile.cspulse -t ${{ secrets.ECR_REGISTRY }}/cspulse-platform:latest .
          docker push ${{ secrets.ECR_REGISTRY }}/cspulse-platform:latest
