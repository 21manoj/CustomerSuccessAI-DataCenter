# Build linux/amd64 images on GitHub-hosted ubuntu-latest (native x86_64, no Mac QEMU),
# push to ECR.
#
# EC2 deploy: native git pull + build on the instance (docker-compose.ec2-build.yml /
# scripts/ec2-git-pull-rebuild.sh). A prior "CI rehydrate over SSH" job was removed for
# now; restore from git history if you add CSPULSE_SSH_PRIVATE_KEY and want it back.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# Edit env.ECR_REGISTRY in this file if your AWS account/registry differs.

name: CS Pulse — ECR build (amd64)

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Pass --no-cache to docker buildx (full image rebuild, no layer cache)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "kpi-dashboard/**"
      - "load-driver/**"
      - ".github/workflows/cspulse-ecr-build-push.yml"

env:
  AWS_REGION: us-east-1
  # Override in the workflow if your account/registry differs.
  ECR_REGISTRY: 822824391150.dkr.ecr.us-east-1.amazonaws.com

concurrency:
  group: cspulse-ecr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push cspulse-platform
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.no_cache }}" = "true" ]; then
            EXTRA="--no-cache"
          fi
          docker buildx build --platform linux/amd64 $EXTRA \
            -f kpi-dashboard/Dockerfile.cspulse \
            -t "${ECR_REGISTRY}/cspulse-platform:latest" \
            --push .

      - name: Build and push cspulse-postgres
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.no_cache }}" = "true" ]; then
            EXTRA="--no-cache"
          fi
          docker buildx build --platform linux/amd64 $EXTRA \
            -f kpi-dashboard/docker/postgres/Dockerfile \
            -t "${ECR_REGISTRY}/cspulse-postgres:latest" \
            --push kpi-dashboard/docker/postgres

      - name: Build and push cspulse-load-driver
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.no_cache }}" = "true" ]; then
            EXTRA="--no-cache"
          fi
          docker buildx build --platform linux/amd64 $EXTRA \
            -f load-driver/Dockerfile \
            -t "${ECR_REGISTRY}/cspulse-load-driver:latest" \
            --push load-driver
